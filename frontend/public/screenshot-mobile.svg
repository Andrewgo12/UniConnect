<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Fondo -->
  <rect width="390" height="844" fill="#fafafa"/>

  <!-- Header -->
  <rect width="390" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="16" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#1e40af">Perfil</text>
  <text x="195" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Sordo</text>
  <text x="370" y="30" font-family="system-ui,sans-serif" font-size="16" fill="#64748b" text-anchor="middle">⚙</text>

  <!-- Área de mensajes -->
  <rect x="16" y="60" width="200" height="36" rx="8" fill="#1e40af"/>
  <text x="116" y="83" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Hola, necesito ayuda</text>

  <rect x="174" y="108" width="200" height="36" rx="8" fill="#f1f5f9"/>
  <text x="274" y="131" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">Recibido, en camino</text>

  <rect x="16" y="156" width="160" height="36" rx="8" fill="#1e40af"/>
  <text x="96" y="179" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">🆘 EMERGENCIA</text>

  <!-- Tabs -->
  <rect x="0" y="680" width="390" height="164" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="0" y="680" width="390" height="36" fill="#f1f5f9"/>
  <text x="65" y="703" font-family="system-ui,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">Chat</text>
  <text x="195" y="703" font-family="system-ui,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Frases</text>
  <text x="325" y="703" font-family="system-ui,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Config</text>
  <rect x="0" y="716" width="130" height="2" fill="#1e40af"/>

  <!-- Botones Chat tab -->
  <rect x="8" y="724" width="180" height="44" rx="8" fill="#1e40af"/>
  <text x="98" y="751" font-family="system-ui,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Hablar</text>

  <rect x="200" y="724" width="182" height="44" rx="8" fill="#dc2626"/>
  <text x="291" y="751" font-family="system-ui,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">EMERGENCIA</text>

  <!-- Input -->
  <rect x="8" y="778" width="290" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="803" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Escribe mensaje...</text>
  <rect x="308" y="778" width="74" height="40" rx="8" fill="#1e40af"/>
  <text x="345" y="803" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Enviar</text>

  <!-- Título de la app -->
  <text x="195" y="840" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">UniConnect — Comunicación Accesible</text>
</svg>
